<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Contacto', 'Escribile a CHI2 por WhatsApp o dejá tu consulta.')}"></head>
<body class="bg-fondo text-tinta antialiased">
<header th:replace="~{fragments/layout :: encabezado}"></header>
<main class="mx-auto max-w-5xl px-4 py-16">
	<h1 class="text-4xl font-bold tracking-tight sm:text-6xl">Hablemos</h1>
	<p class="mt-6 max-w-2xl text-lg text-tenue">La forma más rápida es WhatsApp. Si preferís, dejanos tu consulta y te escribimos.</p>
	<div class="mt-8 flex flex-wrap items-center gap-4">
		<a th:href="${contacto.linkWhatsapp()}"
		   class="rounded-full bg-tinta px-6 py-3 font-medium text-fondo hover:opacity-90">Escribinos por WhatsApp</a>
		<span class="text-sm text-tenue" th:text="${contacto.tiempoRespuesta()}">Respondemos en 24 horas hábiles.</span>
	</div>

	<!-- [PENDIENTE] Formulario: guarda en la base, avisa por mail a los dos (si el mail falla la consulta

	<section class="mt-16 rounded-2xl border border-dashed border-black/20 p-8 text-tenue">
		[PENDIENTE: formulario de contacto]
	</section>
</main>
<footer th:replace="~{fragments/layout :: pie}"></footer>
</body>
</html>
