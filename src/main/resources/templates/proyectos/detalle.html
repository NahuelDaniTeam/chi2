<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${proyecto.nombre}, ${proyecto.resumen})}"></head>
<body class="bg-fondo text-tinta antialiased">
<header th:replace="~{fragments/layout :: encabezado}"></header>
<main class="mx-auto max-w-3xl px-4 py-16">
	<a th:href="@{/proyectos}" class="text-sm text-tenue hover:text-tinta">← Proyectos</a>
	<span class="mt-8 block w-fit rounded-full border border-black/20 px-3 py-1 text-xs font-medium"
	      th:text="${proyecto.estado.etiqueta}">En desarrollo</span>
	<h1 class="mt-4 text-4xl font-bold tracking-tight sm:text-5xl" th:text="${proyecto.nombre}">Proyecto</h1>
	<p class="mt-2 text-tenue" th:text="${proyecto.rubro}">Rubro</p>

	<section class="mt-12">
		<h2 class="text-sm font-medium uppercase tracking-widest text-tenue">El problema</h2>
		<p class="mt-3 text-lg" th:text="${proyecto.problema}">Problema</p>
	</section>
	<section class="mt-10">
		<h2 class="text-sm font-medium uppercase tracking-widest text-tenue">La solución</h2>
		<p class="mt-3 text-lg" th:text="${proyecto.solucion}">Solución</p>
	</section>
	<section class="mt-10">
		<h2 class="text-sm font-medium uppercase tracking-widest text-tenue">Tecnologías</h2>
		<ul class="mt-3 flex flex-wrap gap-2">
			<li th:each="t : ${proyecto.tecnologias}" th:text="${t}"
			    class="rounded-full bg-black/5 px-3 py-1 text-sm">Tecnología</li>
		</ul>
	</section>

	<section th:if="${proyecto.resultado != null}" class="mt-10">
		<h2 class="text-sm font-medium uppercase tracking-widest text-tenue">Resultado</h2>
		<p class="mt-3 text-lg" th:text="${proyecto.resultado}">Resultado</p>
	</section>

	<section th:replace="~{fragments/layout :: cta}"></section>
</main>
<footer th:replace="~{fragments/layout :: pie}"></footer>
</body>
</html>
