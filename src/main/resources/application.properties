spring.application.name=chi2-web

# JPA: el esquema lo manejan las migraciones de Flyway (src/main/resources/db/migration)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Actuator: solo health expuesto
management.endpoints.web.exposure.include=health

# Contacto (CLAUDE.md §7). [PENDIENTE] completar; en producción, por variables de entorno.
# whatsapp: formato internacional sin "+" ni espacios, ej 5493511234567
chi2.contacto.whatsapp=${CHI2_CONTACTO_WHATSAPP:}
chi2.contacto.email=${CHI2_CONTACTO_EMAIL:}
chi2.contacto.mensaje-whatsapp=Hola CHI2, quiero hacer una consulta.
