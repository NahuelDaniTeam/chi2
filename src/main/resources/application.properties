spring.application.name=chi2-web

# JPA: el esquema lo manejan las migraciones de Flyway (src/main/resources/db/migration)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Actuator: solo health expuesto
management.endpoints.web.exposure.include=health
# Sin chequeo del servidor de mail: si el SMTP falla, las consultas se guardan y se reintentan,
# así que el sitio no tiene que figurar como caído (ni reiniciarse) por eso.
management.health.mail.enabled=false

# Contacto (CLAUDE.md §7). [PENDIENTE] completar; en producción, por variables de entorno.
# whatsapp: formato internacional sin "+" ni espacios, ej 5493511234567
chi2.contacto.whatsapp=${CHI2_CONTACTO_WHATSAPP:}
chi2.contacto.email=${CHI2_CONTACTO_EMAIL:}
chi2.contacto.mensaje-whatsapp=Hola CHI2, quiero hacer una consulta.

# Detrás del proxy del hosting, la IP real sale de X-Forwarded-For (límite por IP del formulario)
server.forward-headers-strategy=framework

# La sesión (para el mensaje de éxito del formulario) va solo por cookie, nunca en la URL (;jsessionid=)
server.servlet.session.tracking-modes=cookie

# Mail de avisos de consultas (docs/03-formulario-contacto.md §9.2).
# Por defecto apunta a Mailpit (compose.yaml) para no mandar mails reales en desarrollo.
# Producción (Gmail): CHI2_MAIL_HOST=smtp.gmail.com, CHI2_MAIL_PORT=587, CHI2_MAIL_SEGURO=true,
# CHI2_MAIL_USUARIO y CHI2_MAIL_CLAVE (contraseña de aplicación). Nunca en el repo.
spring.mail.host=${CHI2_MAIL_HOST:127.0.0.1}
spring.mail.port=${CHI2_MAIL_PORT:1025}
spring.mail.username=${CHI2_MAIL_USUARIO:}
spring.mail.password=${CHI2_MAIL_CLAVE:}
spring.mail.properties.mail.smtp.auth=${CHI2_MAIL_SEGURO:false}
spring.mail.properties.mail.smtp.starttls.enable=${CHI2_MAIL_SEGURO:false}
spring.mail.properties.mail.smtp.starttls.required=${CHI2_MAIL_SEGURO:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Formulario de contacto. Destinatarios: mails separados por coma, nunca en el repo.
# Sin destinatarios la app arranca igual y las consultas quedan con aviso PENDIENTE.
chi2.consultas.destinatarios=${CHI2_CONSULTAS_DESTINATARIOS:}
chi2.consultas.remitente=${CHI2_MAIL_USUARIO:sitio@chi2.local}
chi2.consultas.limite-por-hora=5
chi2.consultas.retencion=P3M
